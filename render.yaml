services:
  - type: web
    name: finops-copilot-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: finops-copilot-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: finops-copilot-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: finops-copilot-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: finops-copilot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: finops-copilot-db
          property: password
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: APP_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: finops-copilot-db
    databaseName: finopscopilot
    user: finopsuser
    region: oregon
    plan: free
