version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    # Major TypeScript upgrades need a compatible parser/linter and reviewed tests.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
