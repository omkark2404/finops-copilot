[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = . app
env =
    APP_ENV=test
    POSTGRES_HOST=localhost
    POSTGRES_PORT=5432
    POSTGRES_DB=finops-copilot_test
    POSTGRES_USER=finops-copilot
    POSTGRES_PASSWORD=test
    REDIS_URL=redis://localhost:6379/15
    ARQ_REDIS_URL=redis://localhost:6379/15
    DUCKDB_PATH=/tmp/test_finops-copilot.duckdb
    PARQUET_DIR=/tmp/test_parquet
    JWT_SECRET_KEY=test_secret_key_32chars_minimum_len
    GEMINI_API_KEY=
    ADMIN_EMAIL=admin@test.local
    ADMIN_PASSWORD=testpassword
